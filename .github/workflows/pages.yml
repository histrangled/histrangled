name: Deploy Hexo site to GitHub Pages

on:
  # Bei jedem Push auf den Default-Branch bauen & deployen
  push:
    branches:
      - main
  # Manuell aus dem Actions-Tab startbar
  workflow_dispatch:

# Rechte, die der GITHUB_TOKEN fürs Pages-Deployment braucht
permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deployment gleichzeitig, laufende nicht abbrechen
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (hexo generate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # falls ein Theme als Submodule eingebunden ist

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build with Hexo
        run: npx hexo clean && npx hexo generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
